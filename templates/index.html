# This is the main HTML template for the Flask To-Do app.
# It includes a form to add tasks and a list to display existing tasks.

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask To-Do App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Flask To-Do App</h1>
        </header>

        <section class="task-form">
            <form action="/add_task" method="POST">
                <div class="form-group">
                    <label for="task_name">Task Name</label>
                    <input type="text" id="task_name" name="task_name" required>
                </div>
                <div class="form-group">
                    <label for="task_description">Task Description</label>
                    <textarea id="task_description" name="task_description" rows="3" required></textarea>
                </div>
                <button type="submit">Add Task</button>
            </form>
        </section>

        <section class="task-list">
            <h2>Your Tasks</h2>
            <ul>
                {% for task in tasks %}
                <li class="task-item">
                    <div class="task-content">
                        <h3 class="task-name">{{ task.name }}</h3>
                        <p class="task-description">{{ task.description }}</p>
                    </div>
                    <button class="delete-btn" onclick="deleteTask('{{ task._id }}')">Delete</button>
                </li>
                {% endfor %}
            </ul>
        </section>
    </div>

    <script>
        function deleteTask(taskId) {
            window.location.href = '/delete_task/' + taskId;
        }
    </script>
</body>
</html>
